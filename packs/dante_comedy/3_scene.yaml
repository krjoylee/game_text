pack:
  id: dante_comedy
  title: '단테의 신곡: 지옥·연옥·천국'
  difficulty:
    tier: hard
    name: 어려움 (성인 문학 권장)
    description: 지옥의 심연에서 연옥의 정화를 거쳐 천국의 삼위일체 사랑에 도달하는 20막 대서사시
  world:
    metric:
      name: 신성한 은총의 빛
      icon: ☀️
      initial: 3
      max: 17
  endings:
  - min: 13
    title: 천상의 빛과 합일한 성스러운 대시인
    desc: 지옥의 형벌, 연옥의 정화, 천국의 삼위일체 신비를 모두 관통하여 우주를 움직이는 영원한 사랑과 하나가 되었습니다.
  - min: 8
    title: 연옥을 넘어선 순례자
    desc: 죄악의 무거운 짐을 벗어던지고 베아트리체의 인도를 받아 천상의 문턱에 도달했습니다.
  - min: -99
    title: 지옥을 목격한 방랑자
    desc: 인간 영혼의 깊은 죄악과 고통을 뼈에 새기며 지상에서의 새로운 참회를 다짐했습니다.
scenes:
- act: 1
  title: '지옥편 1: 어두운 숲과 베르길리우스'
  speaker: 단테와 베르길리우스
  dialogue: '단테: ''길을 잃었습니다, 스승이여... 맹수들이 길을 가로막습니다...''

    베르길리우스: ''두려워 마라. 내가 그대를 지옥과 연옥을 지나 천국으로 인도하리라.'''
  hint: 방황 속에서 참된 이성의 목소리에 영혼을 맡기십시오.
  is_transition: false
  choices:
  - text: 스승의 손을 잡고 지옥의 문으로 굳건히 발을 딛는다
    delta: 1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+1)
  - text: 공포에 질려 뒷걸음질 친다
    delta: -1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (-1)
- act: 2
  title: '지옥편 2: 아케론 강의 뱃사공 카론'
  speaker: 카론과 베르길리우스
  dialogue: '카론: ''살아있는 자여, 썩 물러가라! 영원한 암흑 속으로 떠날지니!''

    베르길리우스: ''카론이여, 분노를 거두라. 저 높은 곳에서 명하신 바이니라!'''
  hint: 심연의 공포 앞에서도 하늘이 명한 순례임을 신뢰하십시오.
  is_transition: true
  button_text: 천상의 빛을 향해 경건히 발걸음을 옮긴다
- act: 3
  title: '지옥편 3: 애욕의 암흑 폭풍과 프란체스카'
  speaker: 프란체스카와 단테
  dialogue: '프란체스카: ''영원한 암흑 폭풍 속에서도 파올로와 저는 서로를 놓지 못합니다...''

    단테: ''오 프란체스카여, 그대의 고통에 가슴이 찢어지는구려...'''
  hint: 인간적 비극에 대한 깊은 연민과 신의 정의를 통찰하십시오.
  is_transition: false
  choices:
  - text: 두 연인의 비극에 탄식하며 눈물을 흘린다
    delta: 1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+1)
  - text: 죄는 죗값이라며 냉정하게 고개를 돌린다
    delta: -1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (-1)
- act: 4
  title: '지옥편 4: 불타는 석관의 파리나타'
  speaker: 파리나타와 단테
  dialogue: '파리나타: ''화염이 내 몸을 태울지라도, 내 조국 피렌체의 운명은 어떻게 되었는가!''

    단테: ''지옥불 속에서도 그대의 오만한 기개는 꺾이지 않는구려.'''
  hint: 지옥의 형벌 속에서도 굴복하지 않는 인간 정신의 거대한 기개.
  is_transition: true
  button_text: 천상의 빛을 향해 경건히 발걸음을 옮긴다
- act: 5
  title: '지옥편 5: 끓는 피의 강 플레게톤'
  speaker: 켄타우로스 네소스와 단테
  dialogue: '네소스: ''폭력을 휘두른 자들은 펄펄 끓는 피의 강에 잠긴다. 내 등에 타라, 시인이여!'''
  hint: 남을 피 흘리게 한 자는 피의 강에 잠기는 것이 영원한 법칙입니다.
  is_transition: true
  button_text: 천상의 빛을 향해 경건히 발걸음을 옮긴다
- act: 6
  title: '지옥편 6: 말레볼제 지옥 뱀의 고통'
  speaker: 해설과 베르길리우스
  dialogue: '해설: ''거대한 지옥 뱀이 사기꾼들의 살점을 물어뜯어 재로 태우고, 다시 부활하는 고통이 끝없이 반복된다!'''
  hint: 죄악의 추악한 실체를 직시하는 것이 참된 정화의 시작입니다.
  is_transition: true
  button_text: 천상의 빛을 향해 경건히 발걸음을 옮긴다
- act: 7
  title: '지옥편 7: 얼음 호수 코키토스와 탈출'
  speaker: 단테와 베르길리우스
  dialogue: '단테: ''거인 루시퍼의 몸뚱이를 딛고 지옥의 구멍을 빠져나왔습니다!''

    베르길리우스: ''보라, 머리 위로 찬란한 별들이 쏟아지는구나!'''
  hint: 심연의 가장 어두운 지옥을 통과한 자만이 밤하늘의 별을 볼 수 있습니다.
  is_transition: false
  choices:
  - text: 무릎을 꿇고 구원의 은혜에 감격하며 별을 우러러본다
    delta: 1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+1)
  - text: 지옥의 공포에 치를 떨며 주저앉는다
    delta: 0
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+0)
- act: 8
  title: '연옥편 1: 카토와 정화의 해변'
  speaker: 카토와 베르길리우스
  dialogue: '카토: ''지옥의 때를 씻어내어라! 골풀로 허리를 묶고 이슬로 얼굴을 닦아라!''

    단테: ''바다 안개가 걷히며 새벽의 샛별이 푸르게 빛나기 시작했다.'''
  hint: 지옥의 절망을 씻어내고 참회의 겸손함으로 마음을 정화하십시오.
  is_transition: false
  choices:
  - text: 이슬로 얼굴을 씻고 참회의 띠를 맨다
    delta: 1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+1)
  - text: 자신은 죄인이 아니라며 자만한다
    delta: -1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (-1)
- act: 9
  title: '연옥편 2: 천사의 나룻배와 영혼들'
  speaker: 단테와 카셀라
  dialogue: '카셀라: ''(아름다운 목소리로 단테의 시를 노래한다)''

    카토: ''느림보 영혼들이여, 왜 멈추어 있는가? 어서 산으로 달려가 영혼의 허물을 벗지 못할까!'''
  hint: 감미로운 예술의 도취조차 넘어서야 할 정화의 긴박성.
  is_transition: true
  button_text: 천상의 빛을 향해 경건히 발걸음을 옮긴다
- act: 10
  title: '연옥편 3: 연옥의 문과 일곱 개의 P'
  speaker: 천사와 단테
  dialogue: '천사: ''(불타는 검으로 단테의 이마에 7개의 ''P(Peccatum, 죄)''를 새기며) 회개의 눈물로 이 일곱 상처를
    씻어내거라!''

    단테: ''금 열쇠와 은 열쇠가 문을 열며 거대한 찬송이 울려 퍼졌다.'''
  hint: 고통을 피하지 않고 정면으로 마주하는 능동적 참회의 문.
  is_transition: false
  choices:
  - text: 이마의 상처를 겸허히 받아들이며 좁은 문으로 들어선다
    delta: 1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+1)
  - text: 고통스러운 상처에 불만을 터뜨린다
    delta: -1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (-1)
- act: 11
  title: '연옥편 4: 제1제단 거대한 바위를 진 교만'
  speaker: 단테와 오데리시
  dialogue: '오데리시: ''세상의 명성이란 한 줄기 바람에 불과하오! 이 무거운 바위를 지고 머리를 조아릴 때 비로소 영혼이 가벼워진다오.''

    단테: ''나 역시 오만의 죄를 뉘우치며 허리를 깊이 굽혔다.'''
  hint: 무거운 바위를 짊어짐으로써 교만을 부수고 겸손을 배우는 영혼.
  is_transition: false
  choices:
  - text: 허리를 깊이 숙이고 오데리시와 함께 걷는다
    delta: 1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+1)
  - text: 바위의 무게에 짓눌려 불평한다
    delta: -1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (-1)
- act: 12
  title: '연옥편 5: 제5제단 바닥에 엎드린 탐욕'
  speaker: 위그 카페와 단테
  dialogue: '위그 카페: ''우리는 평생 물질을 탐했기에, 이제 얼굴을 차가운 흙바닥에 대고 엎드려 울부짖는다오... ''내 영혼이 진토에
    붙었사오니!'' '''
  hint: 탐욕에 묶였던 시선을 대지에서 거두어 하늘로 향하는 참회.
  is_transition: true
  button_text: 천상의 빛을 향해 경건히 발걸음을 옮긴다
- act: 13
  title: '연옥편 6: 제7제단 순결의 불꽃 벽'
  speaker: 베르길리우스와 단테
  dialogue: '베르길리우스: ''단테여, 이 불꽃 벽을 통과해야 베아트리체를 만날 수 있네! 날 믿고 뛰어들게!''

    단테: ''불꽃이 온몸을 태울 듯 뜨거웠으나, 스승의 격려에 눈을 감고 불속으로 뛰어들었다!'''
  hint: 지상의 육욕을 태우고 순결한 사랑으로 거듭나는 불의 시련.
  is_transition: false
  choices:
  - text: 스승을 믿고 거침없이 불꽃 벽 속으로 뛰어든다
    delta: 1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+1)
  - text: 불꽃의 뜨거움에 뒷걸음질 치며 주저한다
    delta: -1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (-1)
- act: 14
  title: '연옥편 7: 지상낙원과 베아트리체의 강림'
  speaker: 베르길리우스와 베아트리체
  dialogue: '베르길리우스: ''단테여, 이제 내 인도는 끝났다. 네 의지는 자유롭고 바르니 스스로 왕관을 써라.''

    베아트리체: ''(백합 꽃구름 속에서 순백의 베일을 쓰고 강림하며) 나를 보아라, 단테! 내가 바로 그대의 베아트리체다!'''
  hint: 이성의 스승을 떠나보내고 신성한 은총(신앙과 사랑)과 마주하는 장엄한 결실.
  is_transition: false
  choices:
  - text: 스승 베르길리우스께 눈물의 작별을 고하고 베아트리체 앞에 엎드린다
    delta: 1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+1)
  - text: 베아트리체의 준엄한 시선에 부끄러워 고개를 들지 못한다
    delta: 1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+1)
- act: 15
  title: '천국편 1: 월구(Moon) 서원의 미완'
  speaker: 피카르다와 단테
  dialogue: '피카르다: ''단테여, 우리는 이곳 가장 낮은 하늘에 있지만 조금도 불행하지 않아요. 신의 뜻이 곧 우리의 평화이기 때문이랍니다.''

    단테: ''천국의 모든 곳이 낙원임을 비로소 깨달았습니다.'''
  hint: 신의 섭리 안에서 온전한 평화를 누리는 영혼의 자족.
  is_transition: false
  choices:
  - text: 신의 뜻에 온전히 순명하며 평화를 얻는다
    delta: 1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+1)
  - text: 더 높은 하늘로 올라가지 못함을 아쉬워한다
    delta: -1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (-1)
- act: 16
  title: '천국편 2: 태양구(Sun) 지혜의 빛과 아퀴나스'
  speaker: 토마스 아퀴나스와 단테
  dialogue: '아퀴나스: ''우리는 진리의 빛으로 춤추는 지혜의 영혼들이오! 지상의 학문은 하늘의 지혜 앞에서는 한 줌 티끌에 불과하지.''

    단테: ''열두 영혼이 빛의 화환을 이루어 세 번 선회하며 천상의 찬가를 불렀다.'''
  hint: 인간의 사유가 신성한 지혜의 찬란한 빛으로 승화되는 지고의 순간.
  is_transition: true
  button_text: 천상의 빛을 향해 경건히 발걸음을 옮긴다
- act: 17
  title: '천국편 3: 화성구(Mars) 신앙의 십자가와 조상'
  speaker: 카차구이다와 단테
  dialogue: '카차구이다: ''내 후손 단테여, 피렌체는 그대를 추방할 것이다! 남의 집 빵이 얼마나 짠지 맛보게 되리라! 그러나 그대는
    진실을 두려움 없이 노래해야 한다!'''
  hint: 지상의 추방과 고난을 딛고 영원한 진리를 증언하라는 천상의 소명.
  is_transition: false
  choices:
  - text: 가혹한 유배의 운명을 당당히 받아들이고 시인의 사명을 맹세한다
    delta: 1
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+1)
  - text: 유배의 슬픔에 가슴을 치며 비탄에 잠긴다
    delta: 0
    feedback: 영혼의 순례길에서 숭고한 결단을 내렸습니다. (+0)
- act: 18
  title: '천국편 4: 토성구(Saturn) 관조의 황금 사다리'
  speaker: 베드로 다미아니와 단테
  dialogue: '단테: ''끝없이 하늘로 솟아오른 황금빛 사다리를 보았다... 그 꼭대기는 눈으로 헤아릴 수조차 없고, 수많은 영혼들이 빛의
    섬광이 되어 오르내리고 있었다.'''
  hint: 지극히 깊은 명상과 관조를 통해 도달하는 영적 침묵의 극치.
  is_transition: true
  button_text: 천상의 빛을 향해 경건히 발걸음을 옮긴다
- act: 19
  title: '천국편 5: 엠피레오(Empyrean) 순백의 천상 장미'
  speaker: 베르나르도와 단테

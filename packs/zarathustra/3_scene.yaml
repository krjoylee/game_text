pack:
  id: zarathustra
  title: 차라투스트라는 이렇게 말했다
  difficulty:
    tier: hard
    name: 어려움 (성인 문학 권장)
    description: 신이 죽은 시대, 낙타·사자·아이의 3대 변화를 거쳐 영원회귀와 위버멘쉬를 선언하는 니체의 철학시
  world:
    metric:
      name: 위버멘쉬의 불꽃
      icon: 🦅
      initial: 3
      max: 17
  endings:
  - min: 13
    title: 영원을 긍정하는 위버멘쉬 (초인)
    desc: 모든 고통과 영원회귀의 심연을 뛰어넘어, 대지를 사랑하고 스스로 굴러가는 바퀴인 어린아이의 신성한 긍정에 도달했습니다.
  - min: 8
    title: 포효하는 자유의 사자
    desc: 낡은 도덕의 용을 쓰러뜨리고 '나는 원한다'를 쟁취한 불굴의 정신적 전사가 되었습니다.
  - min: -99
    title: 사막을 건너는 낙타
    desc: 무거운 의무의 짐을 지고 사막을 묵묵히 걸었으나 아직 사자의 자유와 아이의 창조에 닿지 못했습니다.
scenes:
- act: 1
  title: 산에서 내려오는 현자
  speaker: 차라투스트라와 성자
  dialogue: '차라투스트라: ''나는 10년 동안 산속 동굴에서 내 지혜를 채웠다. 이제 인간들에게 내려가 내 잔을 비우련다!''

    숲의 성자: ''그대는 인간에게 재앙이 될 뿐이오. 숲에 남아 신을 찬양하시오!''

    차라투스트라: ''(혼자 숲을 빠져나오며) 저 늙은 성자는 신이 죽었다는 소식을 아직 듣지 못했구나!'''
  hint: 과거의 낡은 우상과 안온한 신앙을 버리고 대지를 향해 내려가는 위대한 하강.
  is_transition: false
  choices:
  - text: 대지를 사랑하며 인간들에게 나의 선물을 나누어주러 내려간다
    delta: 1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (+1)
  - text: 인간들의 어리석음이 두려워 다시 동굴로 돌아간다
    delta: -1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (-1)
- act: 2
  title: '세 가지 변화: 낙타, 사자, 아이'
  speaker: 차라투스트라의 설법
  dialogue: '차라투스트라: ''정신의 세 가지 변화를 말하노라! 무거운 짐을 지고 사막으로 가는 ''낙타''여, ''너는 마땅히 해야 한다''는
    거대한 용에 맞서 ''나는 원한다''고 포효하는 ''사자''여, 그리고 마침내 새로운 시작이자 스스로 굴러가는 바퀴인 ''어린아이''가 되어라!'''
  hint: 복종(낙타)과 파괴(사자)를 넘어 새로운 가치를 창조하는 순수한 긍정(아이).
  is_transition: false
  choices:
  - text: 스스로 굴러가는 바퀴, 신성한 긍정의 어린아이가 된다
    delta: 1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (+1)
  - text: 의무의 짐을 진 낙타의 삶에 안주한다
    delta: -1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (-1)
- act: 3
  title: 줄타기 광대의 추락
  speaker: 차라투스트라와 광대
  dialogue: '광대: ''(줄 위에서 악마 같은 어릿광대의 조롱에 놀라 공중에서 추락한다!)''

    차라투스트라: ''(피 흘리는 광대를 품에 안으며) 인간은 짐승과 위버멘쉬 사이에 놓인 밧줄이다. 그대는 위험을 자신의 천직으로 삼았으니 부끄러워할
    것 없다. 내가 내 손으로 그대를 묻어주마.'''
  hint: 심연 위의 위태로운 밧줄을 걷다가 쓰러진 용감한 자를 향한 깊은 경의.
  is_transition: false
  choices:
  - text: 추락한 자의 용기를 축복하며 시신을 짊어지고 걷는다
    delta: 1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (+1)
  - text: 광대의 어리석은 죽음을 비웃으며 지나친다
    delta: -1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (-1)
- act: 4
  title: 최후의 인간과 위버멘쉬
  speaker: 차라투스트라와 군중
  dialogue: '군중: ''차라투스트라여, 우리에게 저 ''최후의 인간''을 주시오! 낮에도 따스하고 밤에도 따스한 안락을 누릴 테니!''

    차라투스트라: ''아아, 가장 경멸스러운 ''최후의 인간''이여! 그들은 스스로를 경멸할 줄도 모르고 그저 눈을 깜빡거리며 행복을 찾았다고
    자만하는구나!'''
  hint: 고통 없는 나태한 안락에 취해 자기 극복을 잃어버린 현대인에 대한 통렬한 경고.
  is_transition: false
  choices:
  - text: 안락함을 경멸하고 고통을 통한 자기 극복을 택한다
    delta: 1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (+1)
  - text: '''최후의 인간''의 편안한 안주에 마음이 흔들린다'
    delta: -1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (-1)
- act: 5
  title: 창백한 범죄자
  speaker: 차라투스트라의 재판
  dialogue: '차라투스트라: ''이 살인자는 피를 원했으나 이성은 도둑질을 핑계 댔다. 그의 영혼은 자신의 광기를 감당하지 못했다. 판사들이여,
    그를 죽이되 증오하지 말라. 그의 불행을 동정하라!'''
  hint: 억압된 무의식의 병리적 분출과 사법적 위선에 대한 통찰.
  is_transition: true
  button_text: 대지의 뜻을 품고 당당히 발걸음을 옮긴다
- act: 6
  title: 천 개의 목표와 하나의 목표
  speaker: 차라투스트라의 성찰
  dialogue: '차라투스트라: ''민족마다 고유한 선과 악의 가치판단을 지녔다. 그러나 아직 인류 전체를 아우르는 단 하나의 목표는 없다.
    인류에게 목표가 없다면 인류 자신도 없는 것이 아닌가!'''
  hint: 집단적 편견을 넘어 인류 전체의 초월적 지향점을 세우는 과제.
  is_transition: false
  choices:
  - text: 인류의 위대한 극복을 향한 새로운 가치를 세운다
    delta: 1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (+1)
  - text: 민족주의적 도덕의 울타리에 갇힌다
    delta: -1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (-1)
- act: 7
  title: 친구와 고독
  speaker: 차라투스트라의 벗
  dialogue: '차라투스트라: ''자네는 노예인가? 그렇다면 친구가 될 수 없네. 자네는 폭군인가? 그렇다면 친구를 가질 수 없네. 친구란
    자네 안의 위버멘쉬를 깨우는 가장 날카로운 화살이어야 하네.'''
  hint: 나약한 동정이 아니라 서로의 최선과 극복을 요구하는 고귀한 우정.
  is_transition: false
  choices:
  - text: 친구에게 가혹할 정도로 높은 이상의 거울이 되어준다
    delta: 1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (+1)
  - text: 서로의 나약함을 감싸주며 나태함에 타협한다
    delta: -1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (-1)
- act: 8
  title: 시장터의 파리들
  speaker: 차라투스트라의 독백
  dialogue: '차라투스트라: ''친구여, 시장터에서 도망쳐 자네의 고독 속으로 숨어라! 그곳엔 피를 빠는 독파리들이 득실거린다. 배우들과
    소음꾼들에게 환호받는 자는 결코 위대한 것을 창조하지 못한다!'''
  hint: 대중의 인기와 천박한 명성을 버리고 창조적 고독으로 물러남.
  is_transition: true
  button_text: 대지의 뜻을 품고 당당히 발걸음을 옮긴다
- act: 9
  title: '환영과 수수께끼: 영원회귀의 관문'
  speaker: 차라투스트라와 난쟁이
  dialogue: '차라투스트라: ''저 문을 보라, 난쟁이여! 문 위에는 ''순간(Augenblick)''이라 적혀 있다. 뒤로 뻗은 영원의
    길과 앞으로 뻗은 영원의 길이 이 순간에서 마주친다. 우리가 겪은 모든 것이 영원히 다시 되풀이되는 것은 아닌가?!'''
  hint: 모든 순간이 무한히 되풀이된다는 전율스러운 영원회귀의 첫 직면.
  is_transition: false
  choices:
  - text: 영원회귀의 무거운 사유를 용기 있게 직시한다
    delta: 1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (+1)
  - text: 모든 것이 허무하다며 난쟁이의 냉소에 굴복한다
    delta: -1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (-1)
- act: 10
  title: 목동과 검은 뱀
  speaker: 차라투스트라의 환영
  dialogue: '차라투스트라: ''목동의 목구멍에 검은 뱀이 기어 들어가 목을 졸랐다! ''물어뜯어라! 대가리를 물어뜯어라!'' 내가 소리쳤다.
    목동이 뱀 대가리를 콱 깨물어 뱉어냈다. 그는 벌떡 일어나 웃었다. 그 웃음은 인간의 웃음이 아니었다!'''
  hint: 허무주의(검은 뱀)의 목을 물어뜯고 초인적인 웃음으로 다시 태어난 자.
  is_transition: false
  choices:
  - text: 내면의 허무주의를 온 힘으로 물어뜯어 뱉어낸다
    delta: 1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (+1)
  - text: 검은 뱀의 독기에 질식하여 비명을 지른다
    delta: -1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (-1)
- act: 11
  title: 안식일의 고요한 시간
  speaker: 내면의 목소리
  dialogue: '차라투스트라: ''말 없는 목소리가 내게 속삭였다. ''차라투스트라여, 그대는 아직 통치할 준비가 되지 않았다. 어린아이가
    되어 부끄러움을 버려라.'' 나는 울며 다시 산속으로 도망쳤다.'''
  hint: 아직 성숙하지 못한 자아를 가다듬기 위해 겪는 침묵과 수치의 밤.
  is_transition: true
  button_text: 대지의 뜻을 품고 당당히 발걸음을 옮긴다
- act: 12
  title: 낡은 서판과 새로운 서판
  speaker: 차라투스트라의 선언
  dialogue: '차라투스트라: ''나는 낡은 도덕의 서판을 부수었다! 약자들의 원한이 만든 노예 도덕을 깨뜨려라! 사랑하는 자는 창조하려 하고,
    창조하려는 자는 기존의 가치를 파괴해야만 한다!'''
  hint: 낡은 가치를 부수고 삶을 긍정하는 새로운 서판을 조각하는 결단.
  is_transition: false
  choices:
  - text: 낡은 도덕의 서판을 과감히 깨부순다
    delta: 1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (+1)
  - text: 조상들의 전통과 규율을 두려워하며 머뭇거린다
    delta: -1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (-1)
- act: 13
  title: 자발적인 거렁뱅이
  speaker: 차라투스트라와 부자
  dialogue: '거렁뱅이: ''나는 너무 많은 재물에 질식해 스스로 거지가 되었소. 산상수훈을 외치며 마음이 가난한 자가 복이 있다고 하지만,
    그들은 그저 흙탕물 속의 개구리들일 뿐이오.'''
  hint: 물질의 과잉을 버리고 마음의 참된 고요를 찾는 자의 역설.
  is_transition: true
  button_text: 대지의 뜻을 품고 당당히 발걸음을 옮긴다
- act: 14
  title: 그림자의 탄식
  speaker: 차라투스트라와 그림자
  dialogue: '그림자: ''나는 그대를 쫓아 온 세상을 떠돌았습니다. 모든 신념을 잃고 목적지도 잃었습니다. 영원히 방황하는 나는 누구입니까?''

    차라투스트라: ''목적을 잃은 자유는 가장 위험한 감옥이다. 내 동굴로 와서 안식을 찾아라.'''
  hint: 허무주의의 극단에서 길을 잃은 자유의 위험성과 환대.
  is_transition: false
  choices:
  - text: 그림자를 따스하게 품으며 새로운 목표를 가리킨다
    delta: 1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (+1)
  - text: 방황하는 그림자를 냉정하게 쫓아낸다
    delta: -1
    feedback: 위버멘쉬를 향한 사자의 포효를 내질렀습니다. (-1)
- act: 15
  title: 가장 추악한 인간의 고백
  speaker: 가장 추악한 인간과 차라투스트라
  dialogue: '추악한 인간: ''나는 신을 죽였다! 신은 나의 모든 추악함을 꿰뚫어 보았기 때문이다! 나를 부끄럽게 만드는 신의 증인을 견딜
    수 없었다!''

    차라투스트라: ''(그를 경멸하지 않고 두 손을 잡아 일으켜 세운다)'''
  hint: 자신의 치부를 들킨 수치심 때문에 신을 살해한 인간의 실존적 심연.
  is_transition: true
  button_text: 대지의 뜻을 품고 당당히 발걸음을 옮긴다
- act: 16
  title: 동굴 속의 보다 높은 인간들
  speaker: 차라투스트라의 동굴
  dialogue: '차라투스트라: ''왕들, 교황, 학자, 마술사, 추악한 인간이 내 동굴에 모여 울부짖는구나. 그대들은 ''보다 높은 인간''들이지만
    아직 어린아이가 되지 못했다. 절망하지 말라, 그대들의 절망이야말로 위대한 희망의 증거다!'''
  hint: 기존 세계의 실패자들이 모여 나누는 실존적 고뇌와 위로.
  is_transition: false
  choices:

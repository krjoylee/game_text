pack:
  id: '1984'
  title: '1984'
  difficulty:
    tier: medium
    name: 중간 (중고등 도서 권장)
    description: 빅브라더의 감시와 언어 통제, 인간 영혼의 파괴를 경고한 디스토피아 문학의 정점
  world:
    metric:
      name: 인간성의 존엄
      icon: 👁️
      initial: 3
      max: 14
  endings:
  - min: 11
    title: 불멸하는 정신의 수호자
    desc: 가혹한 고문과 세뇌 속에서도 2+2=4의 진실과 인간적 존엄의 불씨를 지켜낸 비극의 영웅입니다.
  - min: 7
    title: 고뇌하는 저항자
    desc: 빅브라더의 거대한 폭력 앞에 육신은 꺾였으나, 마지막 순간까지 자유를 향한 눈물을 흘렸습니다.
  - min: -99
    title: 순응한 빅브라더의 신민
    desc: 공포에 굴복하여 사랑하던 이를 배신하고, 마침내 감시자의 품에 안겨 자신을 잃어버렸습니다.
scenes:
- act: 1
  title: 빅브라더의 눈
  speaker: 윈스턴 스미스
  dialogue: '텔레스크린: ''오세아니아 군이 승리했다! 빅브라더가 당신을 지켜보고 있다!''

    윈스턴: ''텔레스크린의 사각지대에서 금지된 일기장을 펼쳤다... ''빅브라더를 타도하라''고 떨리는 손으로 썼다.'''
  hint: 모든 사생활이 감시당하는 전체주의 사회에서 내면의 자유를 지키는 위험한 첫걸음.
  is_transition: false
  choices:
  - text: 목숨을 걸고 일기장에 진실을 기록한다
    delta: 1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+1)
  - text: 공포에 질려 펜을 내려놓고 텔레스크린 앞에 선다
    delta: -1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (-1)
- act: 2
  title: 2분 증오 시간
  speaker: 군중과 윈스턴
  dialogue: '군중: ''골드스타인을 찢어 죽여라!! 국가의 반역자!!''

    윈스턴: ''광기에 휩싸인 군중 속에서, 저 검은 머리의 소녀 줄리아와 눈이 마주쳤다. 그녀도 나와 같은 생각을 하고 있는 걸까?'''
  hint: 국가가 주입하는 집단적 증오에 휩쓸리지 않고 인간성을 보존하십시오.
  is_transition: false
  choices:
  - text: 광기의 함성 속에서도 냉철한 이성을 유지한다
    delta: 1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+1)
  - text: 발각되지 않기 위해 함께 악을 쓰며 분노를 표출한다
    delta: 0
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+0)
- act: 3
  title: 진리부의 기록 날조
  speaker: 윈스턴과 동료
  dialogue: '윈스턴: ''과거는 날조된다. 초콜릿 배급량이 줄었지만, 신문 기사를 고쳐 어제보다 늘었다고 거짓 보도한다. 과거를 지배하는
    자가 미래를 지배한다.'''
  hint: 객관적 진실이 권력에 의해 지워질 때 인간의 기억만이 유일한 보루입니다.
  is_transition: true
  button_text: 차가운 감시의 시선을 견디며 계속 진행한다
- act: 4
  title: 신어(Newspeak)의 공포
  speaker: 사임과 윈스턴
  dialogue: '사임: ''신어의 목적은 사고의 폭을 좁히는 거요. ''자유''라는 단어가 사라지면 반역이라는 개념 자체가 불가능해지지! 낱말을
    파괴하는 건 정말 아름다운 일이오!'''
  hint: 언어가 축소되고 통제되면 인간의 사유 자체가 마비됩니다.
  is_transition: false
  choices:
  - text: 풍부한 구어와 시적 표현을 가슴속으로 되뇐다
    delta: 1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+1)
  - text: 신어의 간편함에 무비판적으로 동조한다
    delta: -1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (-1)
- act: 5
  title: 프롤(하층민) 구역의 골동품점
  speaker: 채링턴과 윈스턴
  dialogue: '채링턴: ''이 유리 문진을 보시오. 산호가 투명한 유리알 속에 갇혀 있소. 옛 시절의 아름다움이지.''

    윈스턴: ''희망이 있다면 오직 프롤(대중)에게만 있다... 텔레스크린이 없는 2층 방을 빌리자.'''
  hint: 과거의 온전한 기억과 아름다움을 복원하려는 인간의 본능.
  is_transition: false
  choices:
  - text: 유리 문진을 소중히 품에 넣고 인간적 정취를 음미한다
    delta: 1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+1)
  - text: 사치품이라며 발길을 돌린다
    delta: 0
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+0)
- act: 6
  title: 줄리아의 쪽지
  speaker: 줄리아와 윈스턴
  dialogue: '줄리아: ''(복도에서 넘어진 척하며 작은 쪽지를 건넨다)''

    윈스턴: ''(화장실에 숨어 쪽지를 펼친다) 거기엔 단 세 단어가 적혀 있었다. ''당신을 사랑해요''.'' '
  hint: 억압된 사회에서 피어나는 사랑은 그 자체로 가장 거대한 정치적 반역입니다.
  is_transition: false
  choices:
  - text: 심장이 터질 듯한 희망을 품고 약속 장소를 정한다
    delta: 1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+1)
  - text: 사상경찰의 함정일까 두려워 쪽지를 불태운다
    delta: -1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (-1)
- act: 7
  title: 황금의 나라의 밀회
  speaker: 줄리아와 윈스턴
  dialogue: '줄리아: ''사상경찰도 자연의 바람과 지저귀는 새소리는 감시하지 못해요. 당은 성(性)을 증오 에너지로 바꾸려 하지만, 난
    당신과 사랑을 나눌 거예요!'''
  hint: 권력의 통제를 벗어난 육체와 영혼의 진실한 결합.
  is_transition: true
  button_text: 차가운 감시의 시선을 견디며 계속 진행한다
- act: 8
  title: 2층 은신처의 안식
  speaker: 윈스턴과 줄리아
  dialogue: '윈스턴: ''진짜 커피 향기, 설탕, 그리고 당신... 텔레스크린이 없는 이 방은 마치 과거의 시간 속에 멈춘 섬 같아.''

    줄리아: ''벽지 뒤에서 쥐 한 마리가 엿보네요.''

    윈스턴: ''난 쥐가 세상에서 가장 무서워...'''
  hint: 가장 따스한 행복의 순간에조차 도사리고 있는 인간 내면의 원초적 공포.
  is_transition: false
  choices:
  - text: 줄리아를 껴안으며 남은 시간의 소중함을 나눈다
    delta: 1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+1)
  - text: 쥐에 대한 공포로 패닉에 빠진다
    delta: -1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (-1)
- act: 9
  title: 오브라이언의 초대
  speaker: 오브라이언과 윈스턴
  dialogue: '오브라이언: ''형제단은 실재하네. 우리는 골드스타인의 지하 조직이지. 당을 전복하기 위해 무엇이든 할 각오가 되어 있는가?''

    윈스턴과 줄리아: ''네, 기꺼이 목숨을 바치겠습니다!'''
  hint: 자유를 향한 갈망이 때로는 또 다른 음모의 덫으로 이어지는 위험.
  is_transition: false
  choices:
  - text: 자유를 위해 헌신할 것을 맹세한다
    delta: 1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+1)
  - text: 오브라이언의 눈빛에서 서늘한 의구심을 느낀다
    delta: 1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+1)
- act: 10
  title: '체포: 거울 뒤의 텔레스크린'
  speaker: 채링턴과 사상경찰
  dialogue: '소리: ''너희들은 죽은 목숨이다!''

    윈스턴: ''벽에 걸린 낡은 그림 뒤에서 텔레스크린이 나타났다... 골동품점 주인 채링턴은 사상경찰이었다! 유리 문진이 바닥에 떨어져 산산조각
    났다...'''
  hint: 완벽하게 기획된 권력의 덫에 걸려 산산조각 나는 인간적 낙원.
  is_transition: true
  button_text: 차가운 감시의 시선을 견디며 계속 진행한다
- act: 11
  title: 애정부의 암흑 독방
  speaker: 오브라이언과 윈스턴
  dialogue: '오브라이언: ''윈스턴, 자네는 내가 함정에 빠뜨렸다고 생각하나? 난 자네를 구원하러 왔네. 당은 단순한 복종이 아니라 자네의
    영혼을 개조하길 원하지.'''
  hint: 육체적 고문보다 지독한 정신적 세뇌와 자아 해체의 시작.
  is_transition: false
  choices:
  - text: 육신의 고통 속에서도 인간의 존엄성을 붙들려 한다
    delta: 1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+1)
  - text: 즉각 고통에 굴복하며 자백을 쏟아낸다
    delta: -1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (-1)
- act: 12
  title: 2 + 2 = 5 의 고문
  speaker: 오브라이언과 윈스턴
  dialogue: '오브라이언: ''손가락 네 개를 펴 보이며 묻겠네. 이게 몇 개인가?''

    윈스턴: ''넷입니다... 아악!! 고문기를 올리지 마십시오!''

    오브라이언: ''당이 다섯이라 하면 다섯인 걸 진심으로 믿어야 하네. 실재는 당의 마음속에만 존재하지.'''
  hint: 객관적 진리마저 부정하게 만드는 전체주의 광기의 극치.
  is_transition: false
  choices:
  - text: 내면 깊은 곳에서 2+2=4의 진실을 결코 지우지 않는다
    delta: 1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+1)
  - text: 고통을 피하기 위해 5라고 거짓으로 외친다
    delta: -1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (-1)
- act: 13
  title: 101호실의 공포
  speaker: 오브라이언과 윈스턴
  dialogue: '오브라이언: ''101호실에는 세상에서 자네가 가장 두려워하는 것이 기다리고 있네. 굶주린 시궁쥐들이 든 철창 마스크지. 이
    레버를 당기면 쥐들이 자네 얼굴을 파먹을 걸세.''

    윈스턴: ''안 돼... 제발 그것만은 안 돼!!'''
  hint: 자아의 가장 밑바닥 약점을 파고드는 절대 권력의 잔혹한 시험대.
  is_transition: true
  button_text: 차가운 감시의 시선을 견디며 계속 진행한다
- act: 14
  title: 줄리아를 배신하다
  speaker: 윈스턴의 절규
  dialogue: '윈스턴: ''줄리아에게 하세요! 내가 아니라 줄리아에게 저 쥐들을 씌우세요! 그녀의 살을 찢으세요, 난 상관없으니!!''

    오브라이언: ''(미소 지으며 마스크를 거둔다) 완벽하네, 윈스턴.'''
  hint: 자신보다 사랑했던 존재를 배신함으로써 마침내 영혼이 완전히 파괴되는 순간.
  is_transition: false
  choices:
  - text: 차라리 자신이 물어뜯기겠다며 마지막 인성을 지킨다
    delta: 1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+1)
  - text: 공포에 질려 줄리아의 이름을 팔아넘긴다
    delta: -1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (-1)
- act: 15
  title: 체스트넛 나무 카페의 눈물
  speaker: 윈스턴의 종말
  dialogue: '윈스턴: ''진 커피를 마시며 텔레스크린을 올려다보았다... 옛 기억 속 줄리아를 우연히 만났지만 우리 사이엔 아무것도 남아있지
    않았다. 두 줄기 눈물이 뺨을 타고 흘렀다. 투쟁은 끝났다. 나는 나 자신을 이겨냈다. 나는 빅브라더를 사랑했다.'''
  hint: 인간성이 완벽히 패배하고 전체주의에 영혼을 흡수당한 비극적 결말.
  is_transition: false
  choices:
  - text: 눈물 속에서도 지워지지 않은 영혼의 마지막 불씨를 기억한다
    delta: 1
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+1)
  - text: 완전히 체념하고 빅브라더의 품에 안긴다
    delta: 0
    feedback: 감시 사회의 거대한 톱니바퀴 앞에서 선택을 내렸습니다. (+0)

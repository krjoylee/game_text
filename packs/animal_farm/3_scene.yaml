pack:
  id: animal_farm
  title: 동물농장
  difficulty:
    tier: medium
    name: 중간 (중고등 도서 권장)
    description: 이상적 혁명이 부패하여 독재로 변질되는 조지 오웰의 서늘한 정치 풍자극
  world:
    metric:
      name: 비판적 양심
      icon: 🚩
      initial: 3
      max: 14
  endings:
  - min: 11
    title: 깨어있는 역사의 감시자
    desc: 어떤 권력의 거짓 선동과 공포 앞에서도 비판적 이성과 양심을 지켜내어 역사의 진실을 증언했습니다.
  - min: 7
    title: 고뇌하는 농장의 관찰자
    desc: 권력의 타락을 목격하며 이상과 현실 사이에서 깊은 슬픔과 회한을 삼켰습니다.
  - min: -99
    title: 침묵에 순응한 자
    desc: 독재의 채찍과 거짓말 앞에 스스로 생각하기를 멈추고 멍에를 멨습니다.
scenes:
- act: 1
  title: 늙은 메이저의 꿈
  speaker: 메이저 영감과 동물들
  dialogue: '메이저 영감: ''동지들이여, 인간은 일하지 않고 모든 결실을 가로채는 유일한 존재요! 인간을 몰아내고 모든 동물이 평등한
    세상을 만듭시다!''

    동물들: ''잉글랜드의 동물들이여, 멍에와 채찍을 벗어던져라!!'''
  hint: 억압의 구조를 자각하고 이상적인 자유와 평등을 꿈꾸는 첫 각성.
  is_transition: false
  choices:
  - text: 착취 없는 평등한 세상을 향해 혁명의 결의를 다진다
    delta: 1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (+1)
  - text: 인간 주인의 채찍이 두려워 고개를 숙인다
    delta: -1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (-1)
- act: 2
  title: 존스 영감의 추방
  speaker: 스노우볼과 동물들
  dialogue: '스노우볼: ''존스 영감이 채찍을 휘두른다! 모두 뿔과 발굽으로 들이받아라! 농장 밖으로 몰아냈다, 매너 농장은 이제 동물농장이다!!'''
  hint: 용기와 단결로 마침내 독재자를 몰아낸 역사적 승리.
  is_transition: true
  button_text: 역사의 냉엄한 진실을 직시하며 계속 진행한다
- act: 3
  title: 벽에 새긴 7계명
  speaker: 스노우볼과 나폴레옹
  dialogue: '스노우볼: ''벽에 지워지지 않는 7계명을 새기겠소. ''두 다리로 걷는 자는 적, 네 다리로 걷는 자는 동무. 어떤 동물도
    옷을 입거나 침대에서 자거나 다른 동물을 죽여선 안 된다. 모든 동물은 평등하다!'''''
  hint: 혁명의 순수한 이상을 원칙과 법률로 성문화하는 헌정의 순간.
  is_transition: false
  choices:
  - text: 7계명을 가슴에 새기며 글자를 배우려 노력한다
    delta: 1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (+1)
  - text: 글을 모른다며 멍하니 바라만 본다
    delta: 0
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (+0)
- act: 4
  title: 외양간 전투의 영웅
  speaker: 복서와 스노우볼
  dialogue: '복서: ''존스가 총을 들고 쳐들어왔다! 스노우볼이 총탄을 맞으면서도 돌격한다! 나도 말굽으로 적을 내리쳤다! 우리가 농장을
    지켜냈다!'''
  hint: 위기 속에서 피 흘리며 공동체를 수호하는 고결한 헌신.
  is_transition: false
  choices:
  - text: 다친 동료들을 치료하며 1등 동물 훈장을 수여한다
    delta: 1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (+1)
  - text: 전투의 피비린내에 공포를 느끼고 물러선다
    delta: -1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (-1)
- act: 5
  title: 풍차 논쟁과 개들의 습격
  speaker: 나폴레옹과 스노우볼
  dialogue: '스노우볼: ''풍차를 세워 전기를 일으키면 주 3일만 일해도 됩니다!''

    나폴레옹: ''(사나운 개 9마리를 풀며) 스노우볼을 찢어 죽여라!! 스노우볼이 농장 밖으로 피투성이가 되어 쫓겨났다... 토론은 끝났다!'''
  hint: 권력욕에 눈먼 자가 무력과 사병을 동원해 민주적 토론을 학살하는 독재의 시작.
  is_transition: false
  choices:
  - text: 스노우볼의 억울한 추방에 항의하려 입을 연다
    delta: 1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (+1)
  - text: 사나운 개들의 이빨에 짓눌려 침묵하고 만다
    delta: -1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (-1)
- act: 6
  title: 일요일 토론 폐지
  speaker: 스퀼러와 복서
  dialogue: '스퀼러: ''동무들, 나폴레옹 수령님께서 여러분의 결정을 대신 내려주는 무거운 짐을 지셨소! 토론은 위험한 분열일 뿐이오!''

    복서: ''나폴레옹 동지는 언제나 옳다. 내가 더 열심히 일하겠다...'''
  hint: 프로파간다와 우민화 정책에 속아 비판적 이성을 포기하는 대중의 비극.
  is_transition: false
  choices:
  - text: 스퀼러의 궤변에 의문을 품고 계명을 되짚어본다
    delta: 1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (+1)
  - text: '''수령님은 언제나 옳다''며 무비판적으로 복종한다'
    delta: -1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (-1)
- act: 7
  title: 사라진 사과와 우유
  speaker: 스퀼러와 동물들
  dialogue: '스퀼러: ''우유와 사과는 돼지들이 먹어야 하오! 우리가 뇌를 쓰는 지도자이기 때문이오! 존스가 돌아오길 바라시오?''

    동물들: ''존스가 돌아오는 건 싫어... 그래, 돼지들이 먹는 게 맞겠지...'''
  hint: 특권 계급의 정당화 논리와 공포 마케팅에 굴복하는 대중.
  is_transition: true
  button_text: 역사의 냉엄한 진실을 직시하며 계속 진행한다
- act: 8
  title: 혹독한 풍차 건설
  speaker: 복서와 클로버
  dialogue: '복서: ''새벽부터 밤까지 바위를 끌어올린다... 폐가 찢어질 것 같지만 쉬지 않겠다! 동물농장의 번영을 위해!''

    클로버: ''복서, 몸을 아끼세요... 말굽이 다 닳았어요...'''
  hint: 순진하고 우직한 노동자 계급의 자기희생적 착취.
  is_transition: false
  choices:
  - text: 복서의 건강을 염려하며 휴식을 권한다
    delta: 1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (+1)
  - text: 노동량을 늘려 채찍질을 가한다
    delta: -1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (-1)
- act: 9
  title: 무너진 풍차와 마녀사냥
  speaker: 나폴레옹과 스퀼러
  dialogue: '나폴레옹: ''풍차가 무너졌다! 이건 추방된 스노우볼의 파괴 공작이다! 스노우볼의 첩자들을 색출하라!''

    스퀼러: ''스노우볼은 애초부터 존스의 첩자였소!'''
  hint: 자신의 실책을 외부의 적으로 돌려 공포 정치를 강화하는 독재의 전형.
  is_transition: false
  choices:
  - text: 거짓 선동임을 꿰뚫어보고 진실을 밝히려 한다
    delta: 1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (+1)
  - text: 공포에 질려 무고한 이웃을 밀고한다
    delta: -1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (-1)
- act: 10
  title: 피의 숙청과 자백
  speaker: 나폴레옹의 사형 집행
  dialogue: '나폴레옹: ''개들을 시켜 반역을 자백한 돼지들과 암탉들의 목을 물어뜯어라! 피비린내가 농장을 가득 채웠다... 메이저 영감
    이후 처음으로 동물이 동물을 죽였다...'''
  hint: 계명이 깨어지고 피로 물드는 전체주의 숙청의 잔혹성.
  is_transition: true
  button_text: 역사의 냉엄한 진실을 직시하며 계속 진행한다
- act: 11
  title: 변질되는 7계명
  speaker: 클로버와 뮤리엘
  dialogue: '클로버: ''벽의 계명을 읽어줘, 뮤리엘... ''어떤 동물도 술을 마셔선 안 된다'' 뒤에... ''너무 지나치게''라는
    글자가 언제 붙었지? 우리가 잘못 기억한 걸까?'''
  hint: 역사와 법률을 교묘하게 왜곡하여 대중의 기억을 조작하는 지배층.
  is_transition: false
  choices:
  - text: 왜곡된 글자들을 고발하며 항변한다
    delta: 1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (+1)
  - text: 자신의 기억력을 탓하며 체념한다
    delta: -1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (-1)
- act: 12
  title: 인간과의 밀거래
  speaker: 나폴레옹과 휨퍼
  dialogue: '나폴레옹: ''인간 변호사 휨퍼와 계약을 맺고 달걀과 목재를 팔겠다! 돼지들은 이제 존스의 가옥 침대 시트 위에서 잠을 잔다!'''
  hint: 혁명의 주체가 타도 대상이었던 옛 지배자의 악습을 그대로 답습하는 타락.
  is_transition: true
  button_text: 역사의 냉엄한 진실을 직시하며 계속 진행한다
- act: 13
  title: 복서의 최후와 폐마 도살장
  speaker: 클로버와 벤저민
  dialogue: '벤저민: ''바보들아, 마차 옆판을 읽어봐! ''알프레드 시몬스, 폐마 도살 및 피혁 상인!'' 복서는 병원이 아니라 도살장으로
    끌려가고 있어!!''

    복서: ''(마차 안에서 문을 필사적으로 차지만 힘이 빠져 멎는다)'''
  hint: 평생을 헌신한 충직한 일꾼마저 한 줌 고깃덩이로 팔아넘기는 배신의 극치.
  is_transition: false
  choices:
  - text: 도살장 마차를 가로막고 복서를 구하려 몸부림친다
    delta: 1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (+1)
  - text: 스퀼러의 거짓 변명을 믿고 눈물을 삼킨다
    delta: -1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (-1)
- act: 14
  title: 두 발로 걷는 돼지들
  speaker: 돼지들의 행진
  dialogue: '스퀼러와 돼지들: ''(채찍을 들고 두 발로 뒷걸음질 치며 나타난다!)''

    양들: ''네 다리는 좋고, 두 다리는 더 좋다!! 네 다리는 좋고, 두 다리는 더 좋다!!'''
  hint: 인간과 완벽히 동일해진 새로운 독재자의 탄생.
  is_transition: true
  button_text: 역사의 냉엄한 진실을 직시하며 계속 진행한다
- act: 15
  title: 인간과 돼지의 카드놀이
  speaker: 클로버의 응시
  dialogue: '클로버: ''창문 밖에서 안을 들여다보았다. 인간 지주들과 돼지들이 술을 마시며 카드를 치다 싸우고 있었다... 하지만 누가
    돼지이고 누가 인간인지 도무지 분간할 수 없었다.'''
  hint: 혁명이 부패하여 또 다른 독재로 윤회하는 역사의 엄정한 경고.
  is_transition: false
  choices:
  - text: 인간이 된 돼지들을 직시하며 새로운 각성의 씨앗을 품는다
    delta: 1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (+1)
  - text: 절망 속에 고개를 떨구고 어둠 속으로 흩어진다
    delta: 1
    feedback: 역사의 수레바퀴 앞에서 양심의 결단을 내렸습니다. (+1)

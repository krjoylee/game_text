# ============================================
# 흥부놀부전 — 씬 데이터 (3/3)
# ============================================
# 원문 참조: 1_원문.md
# 콘티 참조: 2_콘티.md
# ============================================

# ──────────────────────────────────────────────
# 팩 설정 (pack 정보)
# ──────────────────────────────────────────────

pack:
  id: "heungbu_nolbu"
  title: "흥부놀부전"
  author: "한국 고전 설화"
  description: "형제의 갈림길에서 시작하여 선행과 욕심의 결말을 목도하는 이야기"
  language: "ko"

  difficulty:
    tier: "tutorial"
    name: "기본 튜토리얼 (입문)"
    description: "게임 조작법 및 선악의 기본 구조를 익히는 고전 우화"

  tones:
    casual:
      name: "현대 구어체"
      description: "친근하고 쉽게 읽히는 대화체"
    classic:
      name: "고전 판소리체"
      description: "판소리 사설의 운율과 해학을 살린 문체"
    default: "casual"

  world:
    metric:
      name: "선행의 씨앗"
      name_en: "Seeds of Virtue"
      icon: "♧"
      max: 10
      initial: 3
      description: "선한 행동을 할수록 싹이 트고, 이기적인 선택을 하면 시든다"

    chapter_term: "막"
    chapter_term_en: "Act"

    failure:
      speaker: "narrator"
      message_key: "fail_message"
      return_strategy: "scene_retry"

    password:
      enabled: true
      description: "각 막 도달 시 핵심 키워드를 암호로 부여"

  structure:
    type: "linear"
    chapters:
      - id: "act_01"
        name: "형제의 갈림길"
        password: "형제"
        scenes: ["act01_scene_01"]
      - id: "act_02"
        name: "다친 제비"
        password: "제비"
        scenes: ["act02_scene_01"]
      - id: "act_03"
        name: "박씨"
        password: "박씨"
        scenes: ["act03_scene_01"]
      - id: "act_04"
        name: "흥부의 박"
        password: "금은보화"
        scenes: ["act04_scene_01"]
      - id: "act_05"
        name: "놀부의 욕심"
        password: "욕심"
        scenes: ["act05_scene_01"]
      - id: "act_06"
        name: "놀부의 박"
        password: "도깨비"
        scenes: ["act06_scene_01"]
      - id: "act_07"
        name: "화해"
        password: "우애"
        scenes: ["act07_scene_01"]

  modes:
    full:
      name: "전체 모드"
      description: "7막 전체를 순서대로 진행"
      chapters: "all"
    demo:
      name: "맛보기 모드"
      description: "1~3막만 체험"
      chapters: ["act_01", "act_02", "act_03"]

  characters:
    protagonist:
      id: "heungbu"
      name: "흥부"
      icon: "♧"
    antagonist:
      id: "nolbu"
      name: "놀부"
      icon: "凸"
    support:
      - id: "wife"
        name: "흥부 아내"
        icon: "○"
      - id: "narrator"
        name: "화자"
        icon: "─"

  endings:
    - id: "ending_a"
      name: "형제의 봄"
      min_virtue: 7
      description: "원망 대신 인내를 택하고, 작은 생명 앞에 자비를 베풀었으며, 끝내 형제마저 품에 안은 봄날의 순례자"
    - id: "ending_b"
      name: "교훈의 가을"
      min_virtue: 4
      description: "옳고 그름 사이에서 흔들렸지만, 결국 손을 내밀 줄 아는 사색가"
    - id: "ending_c"
      name: "시든 씨앗"
      min_virtue: 0
      description: "선행의 씨앗을 품었으나 끝내 싹을 틔우지 못한 방랑자"

# ──────────────────────────────────────────────
# 씬 데이터
# ──────────────────────────────────────────────

scenes:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 씬 1: 형제의 갈림길
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  - scene_id: "act01_scene_01"
    act: 1
    act_name: "형제의 갈림길"
    title: "쫓겨나는 흥부"
    theme: "탐욕과 형제의 정"
    message: "부당한 상황 앞에서 어떤 태도를 취할 것인가"
    is_interpreted: false

    card_template:
      - "┌─────────────────────────────────────────────────┐"
      - "│                제1막 · 형제의 갈림길               │"
      - "│                                                  │"
      - "│      ___________                                 │"
      - "│     |  놀부의 집  |                               │"
      - "│     |  _    _    |      {nolbu}                  │"
      - "│     | |_|  |_|   |    ╱                          │"
      - "│     |   ____     |  凸 \"{nolbu_line}\"           │"
      - "│     |  |    |    |                                │"
      - "│     |__|____|____|                                │"
      - "│                                                  │"
      - "│              {heungbu}                            │"
      - "│        ♧   ╱                                     │"
      - "│       凹  \"{heungbu_line}\"                      │"
      - "│      /| \\    ○ ○ ○                               │"
      - "│       |    (아내) (아이들)                         │"
      - "│                                                  │"
      - "│──────────────────────────────────────────────────│"
      - "│                                                  │"
      - "│  {choices}                                       │"
      - "│                                                  │"
      - "│                       ♧ 선행의 씨앗: {virtue_bar} │"
      - "└─────────────────────────────────────────────────┘"

    substitutions:
      tone_casual:
        nolbu: "놀부"
        heungbu: "흥부"
        nolbu_line: "이 집은 전부 내 것이다! 썩 나가!"
        heungbu_line: "형님... 알겠습니다."
      tone_classic:
        nolbu: "놀부"
        heungbu: "흥부"
        nolbu_line: "이 가산은 모두 내 것이니라! 썩 물러가라!"
        heungbu_line: "형님... 분부대로 하겠나이다."

    choices:
      - id: "a"
        text:
          casual: "부모님 말씀을 떠올리며 조용히 돌아선다"
          classic: "선친의 유훈을 되새기며 말없이 물러난다"
        virtue_change: 1
        next_scene: "act02_scene_01"
      - id: "b"
        text:
          casual: "억울함에 형에게 따져본다"
          classic: "억울함을 참지 못하여 형에게 항변한다"
        virtue_change: -1
        next_scene: "act02_scene_01"

    on_fail:
      speaker: "narrator"
      text:
        casual: "잠시 눈을 감고 생각해보자. 이 상황에서 진정 중요한 것은 무엇일까?"
        classic: "잠시 눈을 감고 사려하라. 이 경우에 참으로 귀한 것이 무엇이뇨?"
      return_to: "act01_scene_01"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 씬 2: 다친 제비
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  - scene_id: "act02_scene_01"
    act: 2
    act_name: "다친 제비"
    title: "구렁이와 새끼 제비"
    theme: "작은 생명에 대한 자비"
    message: "가진 것이 없어도 베풀 수 있는가"
    is_interpreted: false

    card_template:
      - "┌─────────────────────────────────────────────────┐"
      - "│                제2막 · 다친 제비                   │"
      - "│                                                  │"
      - "│       ~ ~ ~  처마 밑 둥지  ~ ~ ~                  │"
      - "│          ___                                     │"
      - "│         (___) 삐약삐약!                           │"
      - "│        /|  |\\  ↓ 떨어짐!                          │"
      - "│                                                  │"
      - "│     ~~~~S~~~~  ← 구렁이!                         │"
      - "│                                                  │"
      - "│          >v<  ← 새끼 제비 (다리 부러짐)            │"
      - "│          / X                                     │"
      - "│                                                  │"
      - "│              {heungbu}                            │"
      - "│        ♧   ╱                                     │"
      - "│       凹  \"{heungbu_line}\"                      │"
      - "│       /|\\                                        │"
      - "│                                                  │"
      - "│──────────────────────────────────────────────────│"
      - "│                                                  │"
      - "│  {choices}                                       │"
      - "│                                                  │"
      - "│                       ♧ 선행의 씨앗: {virtue_bar} │"
      - "└─────────────────────────────────────────────────┘"

    substitutions:
      tone_casual:
        heungbu: "흥부"
        heungbu_line: "이 작은 목숨이라도 살려야지..."
      tone_classic:
        heungbu: "흥부"
        heungbu_line: "미물이라 하여 어찌 외면하리..."

    choices:
      - id: "a"
        text:
          casual: "정성껏 실을 감아 제비의 다리를 고쳐준다"
          classic: "정성을 다하여 실로 부목을 대어 제비의 다리를 고쳐주노라"
        virtue_change: 2
        next_scene: "act03_scene_01"
      - id: "b"
        text:
          casual: "우리 먹을 것도 없는데... 모른 척 지나간다"
          classic: "우리 입에 풀칠도 못하는 형편에... 외면하노라"
        virtue_change: -1
        next_scene: "act03_scene_01_alt"

    on_fail:
      speaker: "narrator"
      text:
        casual: "눈앞의 작은 생명이 너를 올려다보고 있다. 다시 생각해보자."
        classic: "눈앞의 미물이 그대를 올려다보고 있느니라. 다시 사려하라."
      return_to: "act02_scene_01"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 씬 3: 박씨 (전환씬)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  - scene_id: "act03_scene_01"
    act: 3
    act_name: "박씨"
    title: "제비가 물어온 씨앗"
    theme: "선행에 대한 보답"
    message: "베풂은 예기치 않은 곳에서 돌아온다"
    is_interpreted: false
    is_transition: true  # 선택지 없는 전환씬

    card_template:
      - "┌─────────────────────────────────────────────────┐"
      - "│                제3막 · 박씨                       │"
      - "│                                                  │"
      - "│                  ~    ~                           │"
      - "│        >v<  ──────>  날아온다!                     │"
      - "│        / \\                                       │"
      - "│              씨앗 하나를 떨어뜨린다                 │"
      - "│                  ○                               │"
      - "│                  ↓                               │"
      - "│            ──────────── 마당                      │"
      - "│                  ●  ← 박씨                        │"
      - "│                                                  │"
      - "│              {heungbu}                            │"
      - "│        ♧   ╱                                     │"
      - "│       凹  \"{heungbu_line}\"                      │"
      - "│       /|\\                                        │"
      - "│                                                  │"
      - "│──────────────────────────────────────────────────│"
      - "│                                                  │"
      - "│  ▶ (아무 키나 눌러 계속)                           │"
      - "│                                                  │"
      - "│                       ♧ 선행의 씨앗: {virtue_bar} │"
      - "└─────────────────────────────────────────────────┘"

    substitutions:
      tone_casual:
        heungbu: "흥부"
        heungbu_line: "어? 제비가 씨앗을 물어다 주다니..."
      tone_classic:
        heungbu: "흥부"
        heungbu_line: "허, 제비가 씨앗을 물어오다니 이 무슨 조화인고..."

    next_scene: "act04_scene_01"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 씬 4: 흥부의 박
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  - scene_id: "act04_scene_01"
    act: 4
    act_name: "흥부의 박"
    title: "금은보화가 쏟아지다"
    theme: "선행의 결실"
    message: "진심 어린 선행은 반드시 복으로 돌아온다"
    is_interpreted: false

    card_template:
      - "┌─────────────────────────────────────────────────┐"
      - "│              제4막 · 흥부의 박                     │"
      - "│                                                  │"
      - "│            ♪ 흥부 박을 타는데~ ♪                   │"
      - "│                                                  │"
      - "│        ┌──────────┐                              │"
      - "│        │  ○○○○○○  │  ← 거대한 박                  │"
      - "│        │ ○      ○ │                              │"
      - "│        │○  ★☆★  ○│  ← 금은보화!                  │"
      - "│        │ ○ ☆★☆  ○│                              │"
      - "│        │  ○○○○○○  │                              │"
      - "│        └──────────┘                              │"
      - "│     {heungbu} ╱     ╲ {wife}                     │"
      - "│    凹  톱 ═══════ 톱  凹                          │"
      - "│    /|\\  \"{heungbu_line}\"                        │"
      - "│                                                  │"
      - "│     ★ 금덩이  ☆ 은덩이  ♦ 비단                   │"
      - "│──────────────────────────────────────────────────│"
      - "│                                                  │"
      - "│  {choices}                                       │"
      - "│                                                  │"
      - "│                       ♧ 선행의 씨앗: {virtue_bar} │"
      - "└─────────────────────────────────────────────────┘"

    substitutions:
      tone_casual:
        heungbu: "흥부"
        wife: "흥부 아내"
        heungbu_line: "엉차! 하늘이 도왔구나!"
      tone_classic:
        heungbu: "흥부"
        wife: "흥부 아내"
        heungbu_line: "영차! 하늘이 굽어살피셨도다!"

    choices:
      - id: "a"
        text:
          casual: "이웃들과 나누며 잔치를 연다"
          classic: "이웃을 불러 함께 나누며 잔치를 베푸노라"
        virtue_change: 1
        next_scene: "act05_scene_01"
      - id: "b"
        text:
          casual: "혹시 모르니 아껴서 잘 보관해둔다"
          classic: "만일을 대비하여 아껴 보관하노라"
        virtue_change: 0
        next_scene: "act05_scene_01"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 씬 5: 놀부의 욕심 (전환씬)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  - scene_id: "act05_scene_01"
    act: 5
    act_name: "놀부의 욕심"
    title: "일부러 부러뜨린 다리"
    theme: "탐욕의 추함"
    message: "거짓 선행은 진정한 선행이 아니다"
    is_interpreted: false
    is_transition: true

    card_template:
      - "┌─────────────────────────────────────────────────┐"
      - "│              제5막 · 놀부의 욕심                   │"
      - "│                                                  │"
      - "│          {nolbu}                                  │"
      - "│        ╱                                         │"
      - "│      凸  \"{nolbu_line}\"                         │"
      - "│      /|\\                                         │"
      - "│                                                  │"
      - "│                >v<  ← 새끼 제비                   │"
      - "│                / \\                               │"
      - "│                 ↓                                │"
      - "│            놀부 손에 붙잡힘                        │"
      - "│                                                  │"
      - "│      凸  꺾 ! ──── 일부러 다리를                   │"
      - "│      /|\\              부러뜨린다                   │"
      - "│                                                  │"
      - "│──────────────────────────────────────────────────│"
      - "│                                                  │"
      - "│  ▶ (아무 키나 눌러 계속)                           │"
      - "│                                                  │"
      - "│                       ♧ 선행의 씨앗: {virtue_bar} │"
      - "└─────────────────────────────────────────────────┘"

    substitutions:
      tone_casual:
        nolbu: "놀부"
        nolbu_line: "나도 하면 되지! 제비 다리만 고쳐주면 끝이잖아!"
      tone_classic:
        nolbu: "놀부"
        nolbu_line: "나인들 못하랴! 제비 다리만 고쳐주면 그만이니라!"

    next_scene: "act06_scene_01"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 씬 6: 놀부의 박 (전환씬)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  - scene_id: "act06_scene_01"
    act: 6
    act_name: "놀부의 박"
    title: "도깨비와 빚쟁이"
    theme: "인과응보"
    message: "거짓과 욕심은 반드시 대가를 치른다"
    is_interpreted: false
    is_transition: true


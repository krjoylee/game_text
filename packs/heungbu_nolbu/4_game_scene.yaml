      - id: "act_04"
        name: "흥부의 박"
        password: "금은보화"
        scenes: ["act04_scene_01"]
      - id: "act_05"
        name: "놀부의 욕심"
        password: "욕심"
        scenes: ["act05_scene_01"]
      - id: "act_06"
        name: "놀부의 박"
        password: "도깨비"
        scenes: ["act06_scene_01"]
      - id: "act_07"
        name: "화해"
        password: "우애"
        scenes: ["act07_scene_01"]

  modes:
    full:
      name: "전체 모드"
      description: "7막 전체를 순서대로 진행"
      chapters: "all"
    demo:
      name: "맛보기 모드"
      description: "1~3막만 체험"
      chapters: ["act_01", "act_02", "act_03"]

  characters:
    protagonist:
      id: "heungbu"
      name: "흥부"
      icon: "♧"
    antagonist:
      id: "nolbu"
      name: "놀부"
      icon: "凸"
    support:
      - id: "wife"
        name: "흥부 아내"
        icon: "○"
      - id: "narrator"
        name: "화자"
        icon: "─"
      - id: "goblin"
        name: "도깨비"
        icon: "鬼"
      - id: "creditor"
        name: "빚쟁이"
        icon: "₩"

  endings:
    - id: "ending_a"
      name: "형제의 봄"
      min_virtue: 7
      description: "원망 대신 인내를 택하고 작은 생명 앞에 자비를 베풀어 끝내 화해를 이룬 순례자"
    - id: "ending_b"
      name: "교훈의 가을"
      min_virtue: 4
      description: "옳고 그름 사이에서 고뇌하며 작은 선행의 씨앗을 틔운 사색가"
    - id: "ending_c"
      name: "시든 씨앗"
      min_virtue: 0
      description: "눈앞의 이익과 원망에 흔들려 선행의 싹을 틔우지 못한 방랑자"


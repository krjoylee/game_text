pack:
  id: "heungbu_nolbu"
  title: "흥부놀부전"
  author: "한국 고전 설화"
  description: "형제의 갈림길에서 시작하여 선행과 욕심의 결말을 목도하는 이야기"
  language: "ko"

  tones:
    casual:
      name: "현대 구어체"
      description: "친근하고 쉽게 읽히는 대화체"
    classic:
      name: "고전 판소리체"
      description: "판소리 사설의 운율과 해학을 살린 문체"
    default: "casual"

  world:
    metric:
      name: "선행의 씨앗"
      name_en: "Seeds of Virtue"
      icon: "♧"
      max: 10
      initial: 3
      description: "선한 행동을 할수록 싹이 트고, 이기적인 선택을 하면 시든다"

    chapter_term: "막"
    chapter_term_en: "Act"

    failure:
      speaker: "화자"
      message_key: "fail_message"
      return_strategy: "scene_retry"

    password:
      enabled: true
      description: "각 막 도달 시 핵심 키워드를 암호로 부여"

  structure:
    type: "linear"
    chapters:
      - id: "act_01"
        name: "형제의 갈림길"
        password: "형제"
        scenes: ["act01_scene_01"]
      - id: "act_02"
        name: "다친 제비"
        password: "제비"
        scenes: ["act02_scene_01"]
      - id: "act_03"

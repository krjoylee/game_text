    dialogue:
      tone_casual:
        - speaker: "화자"
          text: "이듬해 봄, 마당에는 아무런 제비도 오지 않았다."
        - speaker: "흥부"
          text: "그 작은 생명을 모른 척한 내 탓이로구나..."
        - speaker: "흥부"
          text: "가난에 눈이 멀어 도리를 잊었으니 후회스럽다."
      tone_classic:
        - speaker: "화자"
          text: "명춘에 이르렀으되 제비의 자취는 적막하도다."
        - speaker: "흥부"
          text: "가련한 미물을 외면한 내 업보로구나..."
        - speaker: "흥부"
          text: "가난을 탓하며 인정을 버렸으니 회한이 깊도다."

    substitutions:
      tone_casual:
        heungbu_line: "그때 제비를 도왔어야 했는데..."
      tone_classic:
        heungbu_line: "인정을 버렸으니 회한이 깊도다..."


# ============================================
# 데미안 — 씬 데이터 및 메타 규격 (3단계 마스터 스펙)
# ============================================
# 원문/철학 참조: 1_story.md, 1-1_story_structure.md
# 콘티/대화/힌트 참조: 2_conti.md
# ============================================

pack:
  id: "demian"
  title: "데미안"
  title_en: "Demian"
  author: "헤르만 헤세 (Hermann Hesse)"
  description: "밝은 빛의 세계와 어둠의 세계 사이에서 방황하던 싱클레어가 데미안을 만나 알을 깨고 참 자아를 찾아 비상하는 실존주의 성장 소설"
  language: "ko"

  world:
    metric:
      name: "내면의 각성"
      name_en: "Awakening & Self"
      icon: "☥"
      max: 10
      initial: 3
      description: "외부의 규율을 깨뜨리고 내면의 불멸하는 신성을 향해 나아가는 독립성의 척도"

    chapter_term: "막"
    chapter_term_en: "Act"

    failure:
      speaker: "지혜의 사서"
      message_key: "fail_message"
      return_strategy: "scene_retry"

    password:
      enabled: true
      description: "각 막 도달 시 고유 암호 부여"

  structure:
    type: "linear_awakening"
    chapters:
      - id: "act_01"
        name: "두 개의 세계와 크로머"
        password: "사과"
        scenes: ["act01_scene_01"]
      - id: "act_02"
        name: "막스 데미안과 카인의 표식"
        password: "카인"
        scenes: ["act02_scene_01"]
      - id: "act_03"
        name: "베아트리체 초상화"
        password: "초상화"
        scenes: ["act03_scene_01"]
      - id: "act_04"
        name: "알을 깨는 매의 비상"
        password: "아브락사스"
        scenes: ["act04_scene_01"]
      - id: "act_05"
        name: "피스토리우스와 불꽃"
        password: "불꽃"
        scenes: ["act05_scene_01"]
      - id: "act_06"
        name: "에바 부인의 품"
        password: "에바부인"
        scenes: ["act06_scene_01"]
      - id: "act_07"
        name: "마지막 키스와 거울 속 자아"
        password: "거울"
        scenes: ["act07_scene_01"]

  characters:
    protagonist:
      id: "sinclair"
      name: "에밀 싱클레어"
      icon: "☥"
    guide:
      id: "demian"
      name: "막스 데미안"
    tormentor:
      id: "kromer"
      name: "프란츠 크로머"
    mentors:
      - id: "pistorius"
        name: "피스토리우스"
      - id: "eva"
        name: "에바 부인"

  endings:
    - id: "ending_a"
      name: "아브락사스에 도달한 자"
      min_metric: 8
      description: "빛과 어둠의 세계를 모두 통합하고, 알을 깨고 나와 온전한 참 자아를 실현했습니다."
    - id: "ending_b"
      name: "표식을 지닌 자 (카인의 후예)"
      min_metric: 5
      description: "세상의 규율에 굴복하지 않고 내면의 부름을 따르는 고결한 영혼의 소유자가 되었습니다."
    - id: "ending_c"
      name: "알을 깨는 순례자"
      min_metric: 0
      description: "수많은 방황과 고통 끝에 마침내 스스로의 삶을 대면할 용기를 얻었습니다."

scenes:
  - scene_id: "act01_scene_01"
    act: 1
    title: "두 개의 세계와 크로머"
    speaker: "크로머와 싱클레어"
    dialogue: "크로머: '사과를 훔쳤다고 으스대더니 겁쟁이 녀석! 내일까지 2마르크를 가져오지 않으면 네 아비와 경찰에 다 까발릴 테다, 알겠냐?'\n싱클레어: '프란츠, 제발... 우리 집엔 그런 큰돈이 없어... 한 번만 용서해 줘...'"
    hint: "밝고 따스한 부모님의 세계 뒤편에 도사린 어둠의 세계. 거짓말로 시작된 굴레를 어떻게 끊어낼 것인가? 두려움에 굴복할수록 악마의 손아귀는 깊어집니다."
    is_transition: false
    choices:
      - id: "a"
        text: "양심의 가책을 느끼며 더 이상 거짓과 협박에 휘둘리지 않기로 결심한다"
        delta: 2
        feedback: "싱클레어는 떨리는 가슴을 쥐며 어둠의 굴레에서 벗어나려 몸부림쳤습니다. 영혼의 눈이 떠지기 시작했습니다."
        next_scene: "act02_scene_01"
      - id: "b"
        text: "공포에 질려 부모님의 서랍에서 돈을 훔쳐 갖다주려 한다"
        delta: -2
        feedback: "크로머의 잔인한 휘파람 소리가 귓가에 맴돌며, 싱클레어는 죄악의 심연으로 끌려 들어갔습니다."
        next_scene: "act02_scene_01"

  - scene_id: "act02_scene_01"
    act: 2
    title: "막스 데미안과 카인의 표식"
    speaker: "데미안과 싱클레어"
    dialogue: "데미안: '싱클레어, 카인은 비열한 살인자가 아니야. 그는 남들이 감히 갖지 못한 비범한 정신과 용기를 지녔기에 특별한 표식을 갖게 된 거란다.'\n싱클레어: '하지만 성경에는... 하나님이 그를 저주하셨다고 쓰여 있잖아?'\n데미안: '대부분의 사람들은 스스로 생각하기를 두려워하거든. 너는 어때?'"
    hint: "남들이 정해준 맹목적인 도덕과 교리를 넘어서, 내면의 독립적인 이성으로 세상을 직시하는 자만이 '카인의 표식'을 지닙니다."
    is_transition: false
    choices:
      - id: "a"
        text: "그의 대담하고 신비로운 통찰에 깊이 공명하며 귀를 기울인다"
        delta: 2
        feedback: "데미안의 이마에서 은은한 황금빛 후광이 번지며, 싱클레어는 기존 세계의 껍질이 금 가는 것을 느꼈습니다."
        next_scene: "act03_scene_01"
      - id: "b"
        text: "기존 교회의 가르침과 다르다며 두려워 귀를 닫으려 한다"
        delta: -1
        feedback: "데미안은 서글프고도 그윽한 눈빛으로 싱클레어를 바라보며 조용히 침묵했습니다."
        next_scene: "act03_scene_01"

  - scene_id: "act03_scene_01"
    act: 3
    title: "베아트리체 초상화"
    speaker: "싱클레어의 독백"
    dialogue: "싱클레어: '이젤 앞에 홀린 듯 붓을 놀려 그린 이 얼굴... 거리에서 마주친 소녀 베아트리체인 줄 알았으나, 데미안의 얼굴이며, 동시에 내 영혼 깊은 곳의 참된 나 자신의 얼굴이로구나!'"
    hint: "외부의 대상을 향한 동경은 결국 자기 내면의 신성을 발견하기 위한 거울에 불과합니다."
    is_transition: true
    button_text: "초상화에 불을 붙여 태우며 데미안에게 영혼의 전언을 띄운다"
    next_scene: "act04_scene_01"

  - scene_id: "act04_scene_01"
    act: 4
    title: "알을 깨는 매의 비상"
    speaker: "아브락사스와 싱클레어"
    dialogue: "데미안의 편지: '새는 알에서 나오려고 투쟁한다. 알은 세계다. 태어나려는 자는 하나의 세계를 깨뜨려야 한다. 신의 이름은 아브락사스다.'\n싱클레어: '아브락사스... 신적이면서 동시에 악마적인, 빛과 어둠을 모두 품은 절대자여!'"
    hint: "선(善)만을 강요하는 반쪽짜리 세계를 부수지 않고서는 온전한 인간으로 다시 태어날 수 없습니다."
    is_transition: false
    choices:
      - id: "a"
        text: "기존의 세계를 과감히 부수고 참된 자아를 향해 날아오른다"
        delta: 3
        feedback: "황금빛 매가 껍질을 박차고 솟구쳐 창공을 향해 포효했습니다! 영혼의 비상이 시작되었습니다."
        next_scene: "act05_scene_01"
      - id: "b"
        text: "안온하고 익숙했던 유년의 보호막 속에 머물며 망설인다"
        delta: -2
        feedback: "내면의 알껍데기가 삐걱거리며 성장통의 지독한 어둠이 엄습했습니다."
        next_scene: "act05_scene_01"

  - scene_id: "act05_scene_01"
    act: 5
    title: "피스토리우스와 불꽃"
    speaker: "피스토리우스와 싱클레어"
    dialogue: "피스토리우스: '(오르간 건반에서 손을 떼며) 싱클레어, 타오르는 불꽃 속을 응시하게. 그대가 꿈꾸는 모든 신비는 외부가 아닌 그대 가슴속에 이미 살아있네!'\n싱클레어: '선생님, 하지만 홀로 서는 것은 너무나 두렵고 고독합니다...'\n피스토리우스: '고독이야말로 자연이 인간을 성숙시키는 유일한 도가니라네.'"
    hint: "스승의 가르침조차 딛고 넘어서야 비로소 온전한 홀로서기가 완성됩니다."
    is_transition: true
    button_text: "불꽃 속에서 내면의 불멸하는 소리에 귀를 기울인다"
    next_scene: "act06_scene_01"

  - scene_id: "act06_scene_01"
    act: 6
    title: "에바 부인의 품"
    speaker: "에바 부인과 싱클레어"
    dialogue: "에바 부인: '싱클레어, 그대는 먼 길을 돌아 마침내 나를 찾아왔군요. 사랑은 애원하는 것이 아니라, 스스로의 내부에서 확신에 차오르는 것이랍니다.'\n싱클레어: '어머니... 당신은 제 모든 꿈의 종착역이자 운명입니다.'"
    hint: "모성적인 대지이자 영혼의 고향. 참된 사랑은 구걸하는 것이 아니라 확신으로 이끄는 힘입니다."
    is_transition: true
    button_text: "대모신의 자애로운 손길을 느끼며 참 자아를 각성한다"
    next_scene: "act07_scene_01"

  - scene_id: "act07_scene_01"
    act: 7
    title: "마지막 키스와 거울 속 자아"
    speaker: "데미안과 싱클레어"
    dialogue: "데미안: '(야전병원 침대에서 희미하게 미소 지으며) 어린 싱클레어... 이제 내가 없더라도 네 안의 소리에 귀를 기울여 봐. 언젠가 네가 나를 부를 때... 거울을 보면 내 모습이 바로 너 자신 안에 보일 거야.'\n싱클레어: '(데미안의 이마에 입맞춤을 받고 조용히 거울을 마주한다)'"
    hint: "스승과 친구는 떠나갔으나, 그가 일깨운 빛은 영원히 내 영혼의 일부가 되었습니다."
    is_transition: false
    choices:
      - id: "a"
        text: "거울 속에 비친 완전히 성숙해진 나 자신을 직시하며 미소 짓는다"
        delta: 3
        feedback: "거울 속에 비친 싱클레어의 눈동자는 완전히 데미안과 하나가 되어 있었습니다. 순례는 완성되었습니다."
        next_scene: "ending"
      - id: "b"
        text: "떠나간 친구의 빈자리를 슬퍼하며 뜨거운 눈물로 작별을 고한다"
        delta: 1
        feedback: "데미안의 키스는 지워지지 않는 영원한 표식이 되어 싱클레어의 가슴에 아로새겨졌습니다."
        next_scene: "ending"

pack:
  id: matilda
  title: 마틸다
  difficulty:
    tier: easy
    name: 쉬움 (초등 도서 권장)
    description: 책을 사랑하는 천재 소녀 마틸다의 유쾌하고 통쾌한 정의 실현극
  world:
    metric:
      name: 지혜와 정의
      icon: 📖
      initial: 3
      max: 10
  endings:
  - min: 8
    title: 기적을 부르는 위대한 작은 거인
    desc: 폭력과 무지에 굴복하지 않고 뛰어난 지성과 용기로 불의를 몰아내어, 가장 따스한 가족의 품에서 행복을 찾았습니다.
  - min: 5
    title: 용기 있는 책벌레 소녀
    desc: 허니 선생님과 함께 부당한 교장을 물리치고 새로운 학교의 희망이 되었습니다.
  - min: -99
    title: 지혜의 싹을 틔운 아이
    desc: 어두운 환경 속에서도 독서의 즐거움을 잃지 않고 스스로의 길을 열었습니다.
scenes:
- act: 1
  title: 무지와 사기의 부모
  speaker: 웜우드 부부와 마틸다
  dialogue: '아버지: ''책 따윈 쓰레기야! TV를 보고 중고차 계기판을 속여 파는 법이나 배워라!''

    마틸다: ''아버지, 책 속에는 온 세상의 지혜가 담겨 있어요... 왜 저를 미워하시나요?'''
  hint: 거짓과 무지로 가득 찬 환경 속에서도 지성을 향한 갈망을 꺾지 마십시오.
  is_transition: false
  choices:
  - text: 도서관으로 달려가 책 속에서 위안과 진리를 찾는다
    delta: 1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (+1)
  - text: 아버지의 억지에 눈물 흘리며 주눅 든다
    delta: -1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (-1)
- act: 2
  title: 공공도서관의 기적
  speaker: 펠프스 부인과 마틸다
  dialogue: '펠프스 부인: ''네 살배기 꼬마가 디킨스와 헤밍웨이를 전부 읽었다고?! 맙소사, 넌 정말 놀라운 천재로구나!''

    마틸다: ''책을 읽고 있으면 제가 마치 배를 타고 전 세계를 여행하는 기분이에요.'''
  hint: 지식은 억압받는 작은 영혼을 가장 넓은 바다로 인도하는 날개입니다.
  is_transition: true
  button_text: 지혜와 용기를 품고 불의에 맞서 나아간다
- act: 3
  title: 악명 높은 트런치불 교장
  speaker: 트런치불과 아이들
  dialogue: '트런치불: ''어린것들은 전부 구더기야! 내 학교에선 군대처럼 복종해야 해! 룰을 어기면 좁은 못 박힌 암흑 방에 가둬버릴
    테다!''

    마틸다: ''교장 선생님은 아이들을 교육하는 게 아니라 고문하고 있어요...'''
  hint: 부당한 폭력과 공포 앞에서도 불의에 굴복하지 않는 용기를 품으십시오.
  is_transition: false
  choices:
  - text: 불의에 분노하며 친구들을 지킬 방법을 고민한다
    delta: 1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (+1)
  - text: 무시무시한 고함에 벌벌 떨며 고개를 숙인다
    delta: -1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (-1)
- act: 4
  title: 자애로운 허니 선생님
  speaker: 허니와 마틸다
  dialogue: '허니 선생님: ''마틸다야, 넌 네 나이보다 수십 년은 앞선 천재성을 지녔단다. 내가 널 온 마음으로 응원하고 지켜줄게.''

    마틸다: ''선생님... 태어나서 제 마음을 이해해 준 어른은 선생님이 처음이에요.'''
  hint: 단 한 사람의 진실한 지지자가 얼어붙은 천재의 영혼을 꽃피웁니다.
  is_transition: false
  choices:
  - text: 선생님께 마음을 열고 깊은 학문의 대화를 나눈다
    delta: 1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (+1)
  - text: 어른들에 대한 불신으로 마음의 문을 닫는다
    delta: -1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (-1)
- act: 5
  title: 초콜릿 케이크의 브루스
  speaker: 트런치불과 브루스
  dialogue: '트런치불: ''내 케이크를 훔쳐먹었지? 저 거대한 초콜릿 케이크를 한 조각도 남기지 말고 전교생 앞에서 다 먹어치워라!!''

    아이들: ''브루스! 포기하지 마! 힘내라, 다 먹어버려!! 만세!!'''
  hint: 연대와 응원은 독재자의 가혹한 형벌조차 통쾌한 승리의 축제로 뒤바꿉니다.
  is_transition: true
  button_text: 지혜와 용기를 품고 불의에 맞서 나아간다
- act: 6
  title: 허니 선생님의 오두막
  speaker: 허니와 마틸다
  dialogue: '허니: ''트런치불은 사실 내 이모란다... 부모님의 유산과 집을 모조리 빼앗겨 난 이 허물어지는 판잣집에서 살고 있지...''

    마틸다: ''그런 악행을 저지르다니... 제가 반드시 선생님의 집과 권리를 되찾아 드릴게요!'''
  hint: 타인의 슬픔과 억울함에 깊이 공명하고 정의를 위해 일어서십시오.
  is_transition: false
  choices:
  - text: 선생님의 눈물을 닦아주며 정의를 실현할 결심을 굳힌다
    delta: 1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (+1)
  - text: 교장의 거대한 힘에 무력감을 느끼며 망설인다
    delta: 0
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (+0)
- act: 7
  title: 각성하는 눈동자의 초능력
  speaker: 마틸다의 독백
  dialogue: '마틸다: ''눈에 힘을 주고 정신을 한곳으로 모으니... 가슴속에서 뜨거운 번개가 튀어 오른다! 저 물컵이... 내 의지대로
    허공에 떠오르고 있어!'''
  hint: 내면의 억압된 분노가 순수한 지성과 결합할 때 기적 같은 힘이 깨어납니다.
  is_transition: false
  choices:
  - text: 정신을 집중하여 염력의 힘을 훈련한다
    delta: 1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (+1)
  - text: 기이한 힘에 두려움을 느끼고 피하려 한다
    delta: -1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (-1)
- act: 8
  title: 유령의 분필 글씨
  speaker: 트런치불과 마틸다
  dialogue: '트런치불: ''칠판의 분필이 혼자 움직여 글씨를 쓰고 있잖아?! ''아가타, 매그너스의 집을 내놓아라, 안 그러면 널 지옥으로
    끌고 가겠다!'' 으아악, 유령이다!!'''
  hint: 지혜와 재치는 무지막지한 폭력자를 스스로의 공포 속에 무너뜨리는 가장 강력한 무기입니다.
  is_transition: true
  button_text: 지혜와 용기를 품고 불의에 맞서 나아간다
- act: 9
  title: 달아나는 독재자
  speaker: 아이들과 마틸다
  dialogue: '아이들: ''괴물 교장 트런치불이 비명을 지르며 학교 밖으로 영원히 도망쳤다! 만세!! 학교에 봄이 찾아왔어!''

    허니: ''마틸다야, 네가 내 집과 학교를 구원했단다...'''
  hint: 정의가 승리했을 때의 자유는 억압받던 모든 이들의 영혼을 해방합니다.
  is_transition: false
  choices:
  - text: 친구들과 함께 자유의 기쁨을 만끽하며 환호한다
    delta: 1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (+1)
  - text: 승리의 도취에 교만해진다
    delta: -1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (-1)
- act: 10
  title: 참된 가족의 품
  speaker: 허니와 마틸다
  dialogue: '사기꾼 부모: ''경찰이 쫓아와서 우린 스페인으로 도망쳐야 해! 마틸다, 넌 어쩔 테냐?''

    허니: ''마틸다를 제 양녀로 입양하게 해주세요. 평생 사랑으로 기르겠습니다!''

    마틸다: ''선생님과 함께 살 수 있다면 세상에 더 바랄 게 없어요!'''
  hint: 혈연보다 숭고한 것은 영혼의 교감과 참된 사랑으로 맺어진 가족입니다.
  is_transition: false
  choices:
  - text: 허니 선생님의 품에 안겨 진정한 행복을 시작한다
    delta: 1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (+1)
  - text: 부모를 따라가야 하나 잠시 고뇌한다
    delta: 1
    feedback: 마틸다는 용기 있는 지혜를 선택했습니다. (+1)

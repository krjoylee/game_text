pack:
  id: charlie
  title: 찰리와 초콜릿 공장
  difficulty:
    tier: easy
    name: 쉬움 (초등 도서 권장)
    description: 황금 티켓과 달콤한 교훈이 가득한 윌리 웡카의 공장 모험
  world:
    metric:
      name: 순수함의 황금
      icon: 🍫
      initial: 3
      max: 10
  endings:
  - min: 8
    title: 초콜릿 제국의 위대한 후계자
    desc: 온갖 탐욕과 유혹을 순수한 양심으로 물리치고, 윌리 웡카의 모든 유산과 마법을 물려받아 세상에 행복을 선물했습니다.
  - min: 5
    title: 정직한 공장의 소년
    desc: 가난 속에서도 가족을 사랑하고 예의를 지켜 웡카 공장의 따뜻한 보금자리를 얻었습니다.
  - min: -99
    title: 달콤한 꿈을 꾼 아이
    desc: 비록 위대한 후계자가 되진 못했으나 평생 잊지 못할 달콤한 교훈을 얻었습니다.
scenes:
- act: 1
  title: 가난한 버킷 오두막
  speaker: 할아버지와 찰리
  dialogue: '조 할아버지: ''찰리야, 추운 겨울이지만 양배추 수프라도 넉넉히 먹으렴... 황금 티켓 소식 들었니?''

    찰리: ''네, 웡카 공장에 들어갈 수 있는 티켓이 전 세계에 딱 5장뿐이래요. 저한테 그런 행운이 올까요?'''
  hint: 물질적 가난 속에서도 가족에 대한 따스한 사랑을 결코 잃지 마십시오.
  is_transition: false
  choices:
  - text: 가족에게 감사하며 희망을 잃지 않는다
    delta: 1
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (+1)
  - text: 가난한 처지를 비관하며 한숨짓는다
    delta: -1
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (-1)
- act: 2
  title: 마지막 황금 티켓
  speaker: 가게 주인과 찰리
  dialogue: '가게 주인: ''세상에! 눈밭에서 주운 은화로 산 초콜릿 포장지 속에서... 마지막 5번째 황금 티켓이 나왔다!! 꼬마야,
    집으로 곧장 뛰어가!''

    찰리: ''황금 티켓이다! 조 할아버지, 제가 웡카 공장에 갈 수 있게 되었어요!'''
  hint: 하늘이 내린 기적 앞에서도 탐욕에 눈멀지 말고 겸손하게 뛰어가십시오.
  is_transition: true
  button_text: 교훈을 가슴에 새기며 공장 깊숙이 나아간다
- act: 3
  title: 초콜릿 강의 원더랜드
  speaker: 윌리 웡카와 아이들
  dialogue: '윌리 웡카: ''어서 오너라, 어린 친구들! 눈앞에 보이는 건 전부 먹을 수 있단다! 저기 쏟아지는 초콜릿 폭포와 달콤한 민트
    잔디밭을 보렴!''

    찰리: ''세상에... 꿈속에서도 본 적 없는 마법의 낙원이에요!'''
  hint: 상상력의 낙원에 들어섰을 때, 경박한 탐욕을 버리고 경이로운 눈으로 우러러보십시오.
  is_transition: false
  choices:
  - text: 경이로움에 눈을 반짝이며 정중히 웡카를 따른다
    delta: 2
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (+2)
  - text: 식탐을 이기지 못하고 잔디를 마구 뜯어먹는다
    delta: -1
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (-1)
- act: 4
  title: 식탐 소년 아우구스투스
  speaker: 웡카와 찰리
  dialogue: '아우구스투스: ''초콜릿 강물을 다 마셔버릴 테다! 꿀꺽, 꿀꺽... 어어? 빠진다!! 살려줘!''

    웡카: ''쯧쯧, 내 초콜릿 강물은 사람 손이 닿으면 안 되는데... 거대한 흡입관 속으로 빨려 들어가는군!'''
  hint: 끝없는 식탐과 이기심은 스스로를 파멸의 늪으로 빠뜨립니다.
  is_transition: true
  button_text: 교훈을 가슴에 새기며 공장 깊숙이 나아간다
- act: 5
  title: 껌 씹기 소녀 바이올렛
  speaker: 바이올렛과 웡카
  dialogue: '바이올렛: ''세계 신기록 껌이야! 웡카 씨가 말려도 씹을 거야... 어라? 피부가 보라색으로 변하잖아?!''

    웡카: ''미완성 3코스 식사 껌을 씹지 말라고 했거늘... 몸이 거대한 블루베리로 부풀고 있구나!'''
  hint: 어른의 충고를 무시하고 눈앞의 승부욕에 집착하면 블루베리처럼 터져버립니다.
  is_transition: false
  choices:
  - text: 웡카의 경고를 교훈 삼아 분수를 지킨다
    delta: 1
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (+1)
  - text: 자랑하고 싶은 유혹에 껌을 탐낸다
    delta: -1
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (-1)
- act: 6
  title: 응석받이 버루카 솔트
  speaker: 버루카와 아버지
  dialogue: '버루카: ''아빠! 저 다람쥐 당장 사줘! 호두 까는 훈련된 다람쥐 내놔, 안 그러면 숨넘어갈 거야!!''

    웡카: ''안 된단다, 얘야. 저 다람쥐들은 속이 빈 불량 호두를 쓰레기통으로 던지는 녀석들이거든!'''
  hint: 모든 것을 돈으로 사려는 응석받이는 결국 자신이 불량품 쓰레기가 됩니다.
  is_transition: true
  button_text: 교훈을 가슴에 새기며 공장 깊숙이 나아간다
- act: 7
  title: 텔레비전 중독 마이크 티비
  speaker: 마이크와 웡카
  dialogue: '마이크: ''초콜릿을 TV로 전송한다고? 그렇다면 내가 전송되어 TV 화면 속에 들어갈 테다, 야호!!''

    웡카: ''전송은 됐는데... 손가락만 한 난쟁이 크기로 줄어들어 버렸군!'''
  hint: 기계와 미디어의 자극에 영혼을 빼앗기면 자신의 본래 크기를 잃어버립니다.
  is_transition: false
  choices:
  - text: 미디어의 중독에서 벗어나 현실의 온기를 붙든다
    delta: 2
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (+2)
  - text: TV 화면 속 자극에 홀려 뛰어든다
    delta: -2
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (-2)
- act: 8
  title: 단 한 명의 아이
  speaker: 웡카와 찰리
  dialogue: '웡카: ''찰리, 탐욕스러운 다른 아이들은 모두 떨어져 나갔구나. 남은 건 오직 너 하나뿐이란다.''

    조 할아버지: ''우리 찰리는 어떤 속임수도, 탐욕도 부리지 않았습니다!'''
  hint: 정직과 순수함은 온갖 유혹의 폭풍 속에서도 끝내 살아남는 유일한 황금입니다.
  is_transition: false
  choices:
  - text: 겸손하게 고개를 숙이며 웡카에게 감사한다
    delta: 2
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (+2)
  - text: 남들의 불행을 보며 우쭐해한다
    delta: -1
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (-1)
- act: 9
  title: 영원히 녹지 않는 눈깔사탕
  speaker: 슬러그혼의 유혹과 찰리
  dialogue: '찰리: ''웡카 씨, 경쟁자 슬러그혼이 제게 거액을 주며 공장의 비밀 사탕을 빼돌리라 했습니다... 하지만 전 결코 배신할
    수 없어요. 사탕을 돌려드립니다.''

    웡카: ''찰리! 네가 시험을 통과했구나! 넌 정말 정직한 아이야!'''
  hint: 막대한 금전적 이익 앞에서도 양심의 신의를 지키는 자만이 유산을 받을 자격이 있습니다.
  is_transition: false
  choices:
  - text: 한 치의 망설임 없이 사탕을 웡카의 책상에 내려놓는다
    delta: 3
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (+3)
  - text: 가족의 굶주림을 생각하며 사탕을 만지작거린다
    delta: 0
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (+0)
- act: 10
  title: 유리 엘리베이터와 공장 계승
  speaker: 웡카와 찰리 가족
  dialogue: '웡카: ''우주를 뚫고 날아가는 이 거대한 유리 엘리베이터를 보렴! 찰리야, 내 모든 공장과 비밀을 너에게 전부 물려주마!
    너와 네 온 가족이 여기서 영원히 살게 될 게다!''

    찰리: ''할아버지, 어머니, 우리가 해냈어요!!'''
  hint: 순수한 마음으로 선행을 지킨 자에게 세상에서 가장 달콤한 축복이 주어집니다.
  is_transition: false
  choices:
  - text: 가족을 품에 안고 세상 아이들에게 달콤한 꿈을 나눈다
    delta: 3
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (+3)
  - text: 부자가 된 기쁨에 홀로 환호한다
    delta: 1
    feedback: 찰리는 바른 마음가짐을 선택했습니다. (+1)
